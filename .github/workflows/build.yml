name: Build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CEI_Report_Gen.sln

      - name: Build
        run: dotnet build CEI_Report_Gen.sln --configuration Release --no-restore

      - name: Smoke Tests
        run: dotnet src/CEI.ReportGenerator.SmokeTests/bin/Release/net8.0-windows/CEI.ReportGenerator.SmokeTests.dll
